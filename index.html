<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Juego de adivina tu número</title>

    <style>
      html {
        font-family: sans-serif;
      }
      body {
        width: 50%;
        max-width: 800px;
        min-width: 480px;
        margin: 0 auto;
      }
      .lastResult {
        color: white;
        padding: 3px;
      }
    </style>
  </head>

  <body>
      <h1>Juego Adivina tu número</h1>

      <p>Hemos seleccionado un número aleatorío entre 1 a 100. Trata de adivinar el número, en un total de 10 turnos o menos. No te preocupes, te diremos sí el número es más alto o más bajo </p>

<div class="form">
  <label for="guessField">Ingresa el número a adivinar: </label><input type="text" id="guessField" class="guessField">
  <input type="submit" value="Ingresar el número aleatorio" class="guessSubmit">
</div>

<div class="resultParas">
  <p class="guesses"></p>
  <p class="lastResult"></p>
  <p class="lowOrHi"></p>
</div>

</body>

<script>
  // MODIFICACIÓN: Generar número aleatorio entre 1 y 100 (no entre 0 y 10)
  let randomNumber = Math.floor(Math.random() * 100) + 1;

  // MODIFICACIÓN: Cambiar nombre de constante y valor a 10 intentos
  const MAX_ATTEMPTS = 10;
  const guesses = document.querySelector('.guesses');
  const lastResult = document.querySelector('.lastResult');
  // MODIFICACIÓN: Corregir selector (agregar punto para selección por clase)
  const lowOrHi = document.querySelector('.lowOrHi');
  const guessSubmit = document.querySelector('.guessSubmit');
  const guessField = document.querySelector('.guessField');

  let guessCount = 1;
  let resetButton;

  function checkGuess() {

    // MODIFICACIÓN: Convertir entrada a número para comparación correcta
    let userGuess = Number(guessField.value);
    if(guessCount === 1) {
      guesses.textContent = 'Número aleatorio anterior: ';
    }
    guesses.textContent += userGuess + ' ';

   // MODIFICACIÓN: Lógica corregida - felicitaciones al acertar
   if(userGuess === randomNumber) {
      lastResult.textContent = 'Felicitaciones! adivinaste el número!';
      lastResult.style.backgroundColor = 'green';
      lowOrHi.textContent = '';
      setGameOver();
    } else if(guessCount === MAX_ATTEMPTS) {
      // MODIFICACIÓN: Mensaje de derrota cuando se acaban los intentos
      lastResult.textContent = '!!!Perdiste!!! El número era: ' + randomNumber;
      lastResult.style.backgroundColor = 'red';
      setGameOver();
    } else {
      lastResult.textContent = 'Incorrecto! ';
      lastResult.style.backgroundColor = 'red';
      if(userGuess < randomNumber) {
        lowOrHi.textContent = 'El número es mayor!';
      } else if(userGuess > randomNumber) {
        lowOrHi.textContent = 'El número es menor!';
      }
    }

    guessCount++;
    guessField.value = '';
    guessField.focus();
  }
  // MODIFICACIÓN: Corregir nombre del método (addEventListener en lugar de addeventListener)
  guessSubmit.addEventListener('click', checkGuess);

  function setGameOver() {
	  guessField.disabled = true;
	  guessSubmit.disabled = true;
	  resetButton = document.createElement('button');
	  resetButton.textContent = 'Comienza un nuevo juego';
	  document.body.appendChild(resetButton);
	  // MODIFICACIÓN: Corregir nombre del método
	  resetButton.addEventListener('click', resetGame);
  }

  function resetGame() {
	  guessCount = 1;

	  const resetParas = document.querySelectorAll('.resultParas p');
	  for(let i = 0; i < resetParas.length; i++) {
		  resetParas[i].textContent = '';
	  }
	  resetButton.parentNode.removeChild(resetButton);
        
        guessField.disabled = false;
        guessSubmit.disabled = false;
        guessField.value = '';
        guessField.focus();
        
        lastResult.style.backgroundColor = 'white';
        
        // MODIFICACIÓN: Generar nuevo número aleatorio entre 1 y 100 (no siempre 1)
	  randomNumber = Math.floor(Math.random() * 100) + 1;
      }
      
       // MODIFICACIÓN:
      guessSubmit.addEventListener('click', checkGuess);
      
      guessField.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          checkGuess();
        }
      });
</script>
</html>
